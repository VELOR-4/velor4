<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>VELOR4 – LED Lights, Bulbs & more</title>
<meta name="description" content="Buy LED tube lights, bulbs and panels. Free delivery over ₹499. Cash on delivery available.">
<meta property="og:title" content="VELOR4 – LED Lights, Bulbs & more">
<meta property="og:description" content="Buy LED tube lights, bulbs and panels. Free delivery over ₹499. Cash on delivery available.">
<meta property="og:type" content="website">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@500;700;800&family=Plus+Jakarta+Sans:wght@400;600;700&display=swap">
<style>
:root{--bg:#F2F5FB;--surface:#FFFFFF;--ink:#14213D;--muted:#5F6B85;--line:#E1E8F4;--brand:#1A56DB;--brand2:#FF7A00;--on:#FFFFFF;--soft:#E6EEFD;--ok:#0F8A4B;--bad:#E5484D;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#110D1C;--surface:#1B1529;--ink:#EEEAF8;--muted:#A39DBA;--line:#2D2542;--brand:#9B7BFF;--on:#110D1C;--soft:#2A2145;--ok:#4FD18B;--bad:#FF7BA6;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#110D1C;--surface:#1B1529;--ink:#EEEAF8;--muted:#A39DBA;--line:#2D2542;--brand:#9B7BFF;--on:#110D1C;--soft:#2A2145;--ok:#4FD18B;--bad:#FF7BA6;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.45 "Plus Jakarta Sans",system-ui,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:#1546B0;z-index:10}
h1,h2,h3,.logo{font-family:Sora,"Plus Jakarta Sans",sans-serif}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line);padding:10px 14px}
.wrap{max-width:1000px;margin:0 auto}
.r1{display:flex;align-items:center;gap:8px}
.logo{font-weight:800;font-size:1.55rem;letter-spacing:-1px;color:var(--brand);margin-right:auto}
.logo b{color:var(--brand2);background:var(--brand);border-radius:6px;padding:0 5px;margin-left:1px}
.ib{position:relative;border:1px solid var(--line);background:var(--surface);border-radius:50%;width:40px;height:40px;font-size:1.1rem}
.ib i{position:absolute;top:-4px;right:-4px;background:var(--bad);color:#fff;font-style:normal;font-size:.7rem;font-weight:700;min-width:18px;height:18px;border-radius:9px;display:grid;place-items:center;padding:0 4px}
.search{width:100%;margin-top:10px;padding:11px 14px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit}
.cats{display:flex;gap:14px;overflow-x:auto;padding:14px}
.cat{flex:none;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:.78rem;font-weight:600;width:62px}
.cat span{width:54px;height:54px;border-radius:50%;background:var(--surface);border:2px solid var(--line);display:grid;place-items:center;font-size:1.6rem}
.cat[aria-pressed="true"] span{border-color:var(--brand);background:var(--soft)}
.banner{margin:0 14px;border-radius:16px;padding:20px 18px;color:#fff;background:linear-gradient(115deg,#1546B0,#2F6FED)}
.banner h1{margin:0;font-size:1.55rem;line-height:1.15}.banner p{margin:6px 0 0;opacity:.95;font-size:.9rem}
.banner em{font-style:normal;background:var(--brand2);color:#2A1B00;border-radius:6px;padding:1px 8px;font-weight:700}
.tools{display:flex;justify-content:space-between;align-items:center;padding:14px 14px 8px}
.tools h2{margin:0;font-size:1.05rem}
select{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:6px 8px;font:inherit;font-size:.85rem}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;padding:0 14px 40px}
@media(min-width:600px){.grid{grid-template-columns:repeat(auto-fill,minmax(190px,1fr))}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;position:relative;display:flex;flex-direction:column}
.open{border:0;background:none;text-align:left;padding:0;display:flex;flex-direction:column;flex:1}
.pic{aspect-ratio:1;display:grid;place-items:center;font-size:4.2rem}
.rt{position:absolute;left:8px;margin-top:calc(100vw / 2 - 60px);display:none}
.heart{position:absolute;top:8px;right:8px;width:34px;height:34px;border-radius:50%;border:0;background:var(--surface);font-size:1rem;color:var(--muted);box-shadow:0 1px 4px rgba(0,0,0,.2)}
.heart[aria-pressed="true"]{color:var(--bad)}
.body{padding:8px 10px 12px;display:flex;flex-direction:column;gap:2px}
.br{font-weight:700;font-size:.9rem}.nm{color:var(--muted);font-size:.84rem;line-height:1.3}
.pr{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap;margin-top:2px}.pr b{font-size:1.02rem}
.mrp{color:var(--muted);text-decoration:line-through;font-size:.8rem}.off{color:var(--ok);font-weight:700;font-size:.8rem}
.rate{display:inline-block;background:var(--ok);color:#fff;border-radius:6px;font-size:.75rem;font-weight:700;padding:0 6px}
.rv{color:var(--muted);font-size:.78rem;margin-left:4px}
.fd{color:var(--ok);font-size:.78rem;font-weight:600}
.empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:40px 0}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:20;display:none}.scrim.on{display:block}
.sheet{position:fixed;z-index:21;background:var(--bg);color:var(--ink);display:none;flex-direction:column;inset:auto 0 0 0;max-height:92%;border-radius:18px 18px 0 0;padding:16px 14px calc(16px + env(safe-area-inset-bottom,0px));overflow:auto}
.sheet.on{display:flex}
@media(min-width:700px){.sheet{inset:0 0 0 auto;width:430px;max-height:none;border-radius:0}}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.top h2{margin:0;font-size:1.15rem}
.x{border:0;background:var(--surface);border-radius:50%;width:34px;height:34px}
.box{background:var(--surface);border-radius:12px;padding:12px;margin-bottom:10px}
.big{width:100%;border:0;background:var(--brand);color:var(--on);border-radius:12px;padding:14px;font-weight:700}
.big.alt{background:var(--brand2);color:#2A1B00}
.two{display:flex;gap:8px}
.sizes{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.sz{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;min-width:44px;padding:6px 12px;font-weight:600}
.sz[aria-pressed="true"]{border-color:var(--brand);background:var(--soft);color:var(--brand)}
.dp{aspect-ratio:1.3;border-radius:12px;display:grid;place-items:center;font-size:6rem;margin-bottom:10px}
.line{display:flex;gap:10px;align-items:center;padding:8px 0}.line+.line{border-top:1px solid var(--line)}
.line .t{width:50px;height:50px;border-radius:8px;display:grid;place-items:center;font-size:1.7rem;flex:none}
.line .n{flex:1;min-width:0;font-size:.88rem}
.qty{display:flex;align-items:center;gap:6px}
.qty button{width:28px;height:28px;border-radius:50%;border:1px solid var(--line);background:var(--bg)}
.row{display:flex;justify-content:space-between;padding:4px 0;font-size:.92rem}.row.t2{font-weight:800;font-size:1.05rem;border-top:1px dashed var(--line);margin-top:6px;padding-top:8px}
.green{color:var(--ok)}
label.l{display:block;font-size:.85rem;color:var(--muted);margin-top:8px}
input.f{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit}
.cp{display:flex;gap:8px}.cp button{border:0;background:var(--brand);color:var(--on);border-radius:8px;padding:0 16px;font-weight:700}
.pay{display:flex;gap:8px;align-items:center;padding:8px 0}
.err{color:var(--bad);font-size:.85rem;min-height:1.2em}
.muted{color:var(--muted);font-size:.85rem}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;z-index:30;opacity:0;pointer-events:none;transition:opacity .2s}.toast.on{opacity:1}
.pic,.dp,.line .t{overflow:hidden}.pic img,.dp img,.line .t img{width:100%;height:100%;object-fit:cover}
.lnk{border:0;background:none;color:var(--muted);text-decoration:underline;font-size:.85rem}
.sheet select{width:100%;padding:11px 12px}
.skel .pic{background:linear-gradient(90deg,var(--line),var(--bg),var(--line));background-size:200% 100%;animation:skm 1.3s linear infinite}
.sk{display:block;height:12px;border-radius:6px;background:var(--line);margin:9px 0}.sk.s2{width:70%}.sk.s3{width:40%}
@keyframes skm{to{background-position:-200% 0}}
@media(prefers-reduced-motion:reduce){.skel .pic{animation:none}}
.pic{position:relative}.oosb{position:absolute;left:8px;bottom:8px;background:rgba(0,0,0,.72);color:#fff;font-size:.72rem;font-weight:700;padding:4px 9px;border-radius:999px}.card:has(.oosb) .pic img{opacity:.5}
</style>
</head>
<body>
<header><div class="wrap">
  <div class="r1"><span class="logo">VELOR<b>4</b></span>
    <button class="ib" id="ac" aria-label="Account">👤</button>
    <button class="ib" id="wl" aria-label="Wishlist">♥<i id="wc" hidden>0</i></button>
    <button class="ib" id="ct" aria-label="Cart">🛒<i id="cc" hidden>0</i></button></div>
  <input class="search" id="q" type="search" placeholder="Search LED tube, bulb, panel" aria-label="Search products">
</div></header>
<div class="wrap">
  <div class="cats" id="cats" role="group" aria-label="Categories"></div>
  <div class="banner"><h1>End of season sale</h1><p>Up to <em>80% off</em> on fashion, mobiles and home. Free delivery over ₹499. Cash on delivery available.</p></div>
  <div class="tools"><h2 id="ttl">All products</h2><select id="sort" aria-label="Sort"><option value="rel">Relevance</option><option value="lo">Price: low to high</option><option value="hi">Price: high to low</option><option value="rt">Rating</option><option value="of">Discount</option></select></div>
  <main class="grid" id="grid"></main>
  <p style="text-align:center;padding:0 0 30px"><button class="lnk" data-sell>Seller login</button></p>
</div>
<div class="scrim" id="scrim"></div>
<aside class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="Panel"></aside>
<div class="toast" id="toast" role="status"></div>

<script>
const AP=["S","M","L","XL"],SH=["6","7","8","9","10"];
const P0=[]; // no built-in sample products: the shop only shows products from the database
const CATS=[["All","🛍️"],["Women","👗"],["Men","👔"],["Mobiles","📱"],["Home","🏠"],["Beauty","💄"]];
const $=s=>document.querySelector(s);
const inr=n=>"₹"+Math.round(n).toLocaleString("en-IN");
const find=id=>[...P0,...custom].find(x=>x.id==id);
const safe=s=>String(s).replace(/[<>&"]/g,"");
let cat="All",term="",sort="rel",cart={},wish=[],coupon="",view="";
let loadState="loading"; // loading | ready | error
try{cart=JSON.parse(localStorage.getItem("velor4-cart"))||{};wish=JSON.parse(localStorage.getItem("velor4-wish"))||[]}catch(e){}
const ld=(k,d)=>{try{const v=JSON.parse(localStorage.getItem(k));return v==null?d:v}catch(e){return d}};
const sv=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){return false}};
let custom=ld("velor4-custom",[]),hidden=ld("velor4-hidden",[]),user=ld("velor4-user",null),orders=ld("velor4-orders",[]),pin=ld("velor4-pin",""),P=[];
const buildP=()=>{P=[...P0,...custom].filter(p=>!hidden.includes(p.id))};buildP();
const save=()=>{try{localStorage.setItem("velor4-cart",JSON.stringify(cart));localStorage.setItem("velor4-wish",JSON.stringify(wish))}catch(e){}};
const lines=()=>Object.keys(cart).map(k=>{const[id,sz]=k.split("|");return{k,p:find(id),sz,q:cart[k]}}).filter(x=>x.p);
const disc=p=>Math.round((1-p.p/p.m)*100);
function bill(){
  let sub=0,mrp=0,n=0;lines().forEach(({p,q})=>{sub+=p.p*q;mrp+=p.m*q;n+=q});
  const cp=coupon=="VELOR10"?Math.round(sub*.1):0,fee=sub&&sub<499?40:0;
  return{sub,mrp,n,cp,fee,total:sub-cp+fee,saved:mrp-sub+cp};
}
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("on");clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove("on"),1400)}
function badges(){
  const n=Object.values(cart).reduce((a,b)=>a+b,0);$("#cc").hidden=!n;$("#cc").textContent=n;
  $("#wc").hidden=!wish.length;$("#wc").textContent=wish.length;
}
function render(){
  $("#cats").innerHTML=CATS.map(([c,e])=>`<button class="cat" data-c="${c}" aria-pressed="${c==cat}"><span>${e}</span>${c}</button>`).join("");
  $("#ttl").textContent=cat=="All"?"All products":cat;
  let l=P.filter(p=>(cat=="All"||p.c==cat)&&(p.b+p.n+p.c).toLowerCase().includes(term));
  if(sort!="rel")l=[...l].sort((a,b)=>(sort=="lo"?a.p-b.p:sort=="hi"?b.p-a.p:sort=="rt"?b.r-a.r:disc(b)-disc(a))||a.id-b.id);
  const G=$("#grid");
  if(loadState=="loading"){G.setAttribute("aria-busy","true");G.innerHTML=Array(6).fill('<div class="card skel"><div class="pic"></div><div class="body"><span class="sk"></span><span class="sk s2"></span><span class="sk s3"></span></div></div>').join("");badges();return}
  G.removeAttribute("aria-busy");
  if(loadState=="error"){G.innerHTML='<div class="empty">We couldn’t load the products. Please check your internet and try again.<br><br><button class="big" style="max-width:220px" data-retry>Try again</button></div>';badges();return}
  const seen=new Set();l=l.filter(p=>!seen.has(p.id)&&seen.add(p.id));
  G.innerHTML=l.length?l.map(p=>`<div class="card"><button class="open" data-v="${p.id}" aria-label="View ${safe(p.n)}"><div class="pic" style="background:${p.bg}">${p.e}${p.oos?'<span class="oosb">Out of stock</span>':""}</div><div class="body"><span class="br">${p.b}</span><span class="nm">${p.n}</span><div class="pr"><b>${inr(p.p)}</b><span class="mrp">${inr(p.m)}</span><span class="off">${disc(p)}% off</span></div><div>${p.r?`<span class="rate">${p.r} ★</span><span class="rv">(${p.rv})</span>`:""}</div><span class="fd">${p.p>=499?"Free delivery":"Delivery ₹40"}</span></div></button><button class="heart" data-w="${p.id}" aria-pressed="${wish.includes(p.id)}" aria-label="Wishlist">♥</button></div>`).join(""):(P.length?`<div class="empty">Nothing found for “${safe(term)}”. Try another word or category.</div>`:`<div class="empty">No products yet. Please check back soon.</div>`);
  badges();
}
function open(h,v){view=v;$("#sheet").innerHTML=h;$("#sheet").classList.add("on");$("#scrim").classList.add("on")}
function close(){view="";$("#sheet").classList.remove("on");$("#scrim").classList.remove("on")}
const head=t=>`<div class="top"><h2>${t}</h2><button class="x" data-close aria-label="Close">✕</button></div>`;
let pick={id:0,sz:""};
function viewProduct(id){
  const p=find(id);if(pick.id!=id)pick={id,sz:""};
  open(head(p.b)+`<div class="dp" style="background:${p.bg}">${p.e}</div><div class="box"><div>${p.n}</div><div class="pr"><b style="font-size:1.3rem">${inr(p.p)}</b><span class="mrp">${inr(p.m)}</span><span class="off">${disc(p)}% off</span></div><div>${p.r?`<span class="rate">${p.r} ★</span><span class="rv">${p.rv} ratings</span>`:""}</div><p class="fd">${p.p>=499?"Free delivery":"Delivery ₹40, free over ₹499"} · Cash on delivery · 7-day returns</p>${p.s?`<b>Select size</b><div class="sizes">${p.s.map(s=>`<button class="sz" data-sz="${s}" aria-pressed="${pick.sz==s}">${s}</button>`).join("")}</div><div class="err" id="err" role="alert"></div>`:""}</div><div class="two"><button class="big" data-add="${p.id}">Add to cart</button><button class="big alt" data-buy="${p.id}">Buy now</button></div>`,"p");
}
function addCart(id){
  const p=find(id);
  if(p.s&&!pick.sz){$("#err").textContent="Please select a size.";return false}
  const k=id+"|"+(p.s?pick.sz:"");addCart.had=!!cart[k];if(!cart[k])cart[k]=1; // quantity only goes up when the customer taps + in the cart
  save();badges();return true;
}
function viewWish(){
  open(head("My wishlist")+(wish.length?wish.map(id=>{const p=find(id);return `<div class="box line" style="margin-bottom:8px"><div class="t" style="background:${p.bg}">${p.e}</div><div class="n"><b>${p.b}</b><br>${p.n}<br><b>${inr(p.p)}</b></div><button class="x" data-v="${p.id}" aria-label="View ${safe(p.n)}">›</button></div>`}).join(""):`<div class="box">Your wishlist is empty. Tap the heart on any product to save it.</div>`),"w");
}
function viewCart(){
  if(!lines().length){open(head("My cart")+`<div class="box">Your cart is empty. Add something you like.</div><button class="big" data-close>Continue shopping</button>`,"c");return}
  const b=bill();
  open(head(`My cart (${b.n})`)+`<div class="box">${lines().map(({k,p,sz,q})=>`<div class="line"><div class="t" style="background:${p.bg}">${p.e}</div><div class="n"><b>${p.b}</b><br>${p.n}${sz?`<br><span class="muted">Size: ${sz}</span>`:""}<br><b>${inr(p.p)}</b> <span class="mrp">${inr(p.m)}</span></div><div class="qty"><button data-d="${k}" aria-label="Remove one">−</button><span>${q}</span><button data-i="${k}" aria-label="Add one">+</button></div></div>`).join("")}</div>
  <div class="box"><b>Coupon</b><div class="cp" style="margin-top:6px"><input class="f" id="cpn" placeholder="Try VELOR10" value="${safe(coupon)}" aria-label="Coupon code"><button data-cp>Apply</button></div><div class="${b.cp?"green":"err"}" id="cpm">${b.cp?"VELOR10 applied: 10% off":""}</div></div>
  <div class="box"><b>Price details</b><div class="row"><span>Price (${b.n} items)</span><span>${inr(b.mrp)}</span></div><div class="row"><span>Discount</span><span class="green">− ${inr(b.mrp-b.sub)}</span></div>${b.cp?`<div class="row"><span>Coupon</span><span class="green">− ${inr(b.cp)}</span></div>`:""}<div class="row"><span>Delivery</span><span class="${b.fee?"":"green"}">${b.fee?inr(b.fee):"Free"}</span></div><div class="row t2"><span>Total</span><span>${inr(b.total)}</span></div><div class="green" style="font-weight:600;margin-top:6px">You will save ${inr(b.saved)} on this order</div></div>
  <button class="big" data-co>Continue · ${inr(b.total)}</button><button class="sz" data-close style="width:100%;margin-top:8px;border-radius:12px;padding:12px">Continue shopping</button>`,"c");
}
function viewCheckout(){
  const b=bill();
  open(head("Delivery and payment")+`<div class="box"><b>Delivery address</b>
  <label class="l" for="nm">Full name</label><input class="f" id="nm" autocomplete="name" value="${user?safe(user.nm):""}">
  <label class="l" for="ph">Mobile number</label><input class="f" id="ph" inputmode="numeric" maxlength="10" autocomplete="tel-national" value="${user?user.ph:""}">
  <label class="l" for="ad">House no., area, city</label><input class="f" id="ad" autocomplete="street-address">
  <label class="l" for="pn">PIN code</label><input class="f" id="pn" inputmode="numeric" maxlength="6" autocomplete="postal-code"></div>
  <div class="box"><b>Payment</b>
  <label class="pay"><input type="radio" name="py" value="UPI" checked> UPI (GPay, PhonePe, Paytm)</label>
  <label class="pay"><input type="radio" name="py" value="Card"> Credit or debit card</label>
  <label class="pay"><input type="radio" name="py" value="Cash on delivery"> Cash on delivery</label></div>
  <div class="err" id="err" role="alert"></div><button class="big" data-pay>Pay ${inr(b.total)}</button>`,"o");
}
function pay(){
  const nm=$("#nm").value.trim(),ph=$("#ph").value.trim(),ad=$("#ad").value.trim(),pn=$("#pn").value.trim();
  if(!nm||!/^[6-9]\d{9}$/.test(ph)||ad.length<6||!/^\d{6}$/.test(pn)){$("#err").textContent="Enter your name, a 10-digit mobile number, address and 6-digit PIN code.";return}
  const py=document.querySelector('input[name="py"]:checked').value,b=bill();
  const no="OD"+Math.floor(100000000+Math.random()*900000000);
  const d=new Date(Date.now()+4*864e5).toLocaleDateString("en-IN",{weekday:"short",day:"numeric",month:"short"});
  orders.unshift({no,t:Date.now(),ph:user.ph,nm,ad:ad+" – "+pn,py,total:b.total,items:lines().map(({p,sz,q})=>({id:p.id,sz,q}))});sv("velor4-orders",orders);
  cart={};coupon="";save();render();
  open(head("Order placed")+`<div class="box" style="text-align:center"><div style="font-size:3rem">🎉</div><b>Order ${no} confirmed</b><p>Delivery by <b>${d}</b></p><p class="muted">${inr(b.total)} via ${py}<br>Shipping to ${safe(nm)}, ${safe(ad)} – ${pn}</p><p class="muted">Demo store: no payment was taken.</p></div><button class="big" data-track="${no}">Track order</button><br><br><button class="sz" data-close style="width:100%;border-radius:12px;padding:12px">Continue shopping</button>`,"d");
}
document.addEventListener("click",e=>{
  const t=e.target.closest("button,.scrim");if(!t)return;const d=t.dataset;
  if(d.c){cat=d.c;render()}
  else if(d.w){const id=+d.w;wish=wish.includes(id)?wish.filter(x=>x!=id):[...wish,id];save();render();toast(wish.includes(id)?"Saved to wishlist":"Removed from wishlist")}
  else if(d.v){viewProduct(+d.v)}
  else if(d.sz){pick.sz=d.sz;viewProduct(pick.id)}
  else if(d.add){if(addCart(+d.add)){toast(addCart.had?"Already in your cart":"Added to cart");viewCart()}}
  else if(d.buy){if(addCart(+d.buy))viewCart()}
  else if(d.i){cart[d.i]++;save();viewCart();badges()}
  else if(d.d){cart[d.d]--;if(cart[d.d]<=0)delete cart[d.d];save();viewCart();badges()}
  else if(d.cp!==undefined){const v=$("#cpn").value.trim().toUpperCase();if(v=="VELOR10"){coupon=v;viewCart()}else{coupon="";$("#cpm").textContent="This coupon is not valid."}}
  else if(d.co!==undefined){user?viewCheckout():viewLogin("co")}
  else if(d.pay!==undefined){pay()}
  else if(d.otp!==undefined){sendOtp()}
  else if(d.ver!==undefined){verify()}
  else if(d.out!==undefined){window.sbOut&&sbOut();user=null;sv("velor4-user",null);toast("Logged out");close()}
  else if(d.ord!==undefined){viewOrders()}
  else if(d.track){viewTrack(d.track)}
  else if(d.sell!==undefined){viewPin()}
  else if(d.pinok!==undefined){checkPin()}
  else if(d.addp!==undefined){addProduct()}
  else if(d.delp){delProduct(+d.delp)}
  else if(d.rst!==undefined){hidden=[];sv("velor4-hidden",hidden);buildP();render();viewAdmin()}
  if(t.id=="ct")viewCart();
  if(t.id=="wl")viewWish();
  if(t.id=="ac")viewAccount();
  if(d.close!==undefined||t.id=="scrim")close();
});
let otpSent="",tmpU=null,after="",photo="";
function viewLogin(next){
  after=next||"";
  open(head("Login")+`<div class="box"><b>Login or sign up</b><p class="muted">${next?"Log in to place your order.":"Log in to see your orders and track them."}</p><label class="l" for="ln">Name</label><input class="f" id="ln" autocomplete="name"><label class="l" for="lp">Mobile number</label><input class="f" id="lp" inputmode="numeric" maxlength="10" autocomplete="tel-national"><div class="err" id="err" role="alert"></div></div><button class="big" data-otp>Get OTP</button>`,"l");
}
function sendOtp(){
  const nm=$("#ln").value.trim(),ph=$("#lp").value.trim();
  if(!nm||!/^[6-9]\d{9}$/.test(ph)){$("#err").textContent="Enter your name and a valid 10-digit mobile number.";return}
  tmpU={nm,ph};otpSent=String(1000+Math.floor(Math.random()*9000));
  open(head("Verify OTP")+`<div class="box"><p>Enter the OTP for ${ph}.</p><p class="muted">Demo mode: no SMS is sent. Your OTP is <b>${otpSent}</b>.</p><input class="f" id="ot" inputmode="numeric" maxlength="4" aria-label="OTP"><div class="err" id="err" role="alert"></div></div><button class="big" data-ver>Verify and continue</button>`,"l2");
}
function verify(){
  if($("#ot").value.trim()!==otpSent){$("#err").textContent="Wrong OTP. Try again.";return}
  user=tmpU;sv("velor4-user",user);toast("Logged in");
  after=="co"?viewCheckout():viewAccount();
}
function viewAccount(){
  if(!user){viewLogin();return}
  open(head("My account")+`<div class="box"><b>Hi, ${safe(user.nm)}</b><br><span class="muted">+91 ${user.ph}</span></div><div class="box"><button class="big" data-ord>My orders (${orders.filter(o=>o.ph==user.ph).length})</button><br><br><button class="sz" data-out style="width:100%;border-radius:12px;padding:12px">Log out</button></div>`,"a");
}
const STEPS=["Order placed","Packed","Shipped","Out for delivery","Delivered"];
let stage=o=>Math.min(4,Math.floor((Date.now()-o.t)/6e4));
function viewOrders(){
  const l=orders.filter(o=>o.ph==user.ph);
  open(head("My orders")+(l.length?l.map(o=>`<div class="box"><b>${o.no}</b><br><span class="muted">${new Date(o.t).toLocaleDateString("en-IN")} · ${inr(o.total)}</span><br><b class="${stage(o)==4?"green":""}">${STEPS[stage(o)]}</b><br><br><button class="big" data-track="${o.no}">Track order</button></div>`).join(""):`<div class="box">No orders yet. Your orders will show up here.</div>`),"or");
}
function viewTrack(no){
  const o=orders.find(x=>x.no==no),s=stage(o);
  open(head("Track order")+`<div class="box"><b>${o.no}</b><br><span class="muted">${inr(o.total)} · ${o.py}<br>Shipping to ${safe(o.nm)}, ${safe(o.ad)}</span></div><div class="box">${STEPS.map((t,i)=>`<div class="line"><span style="font-size:1.3rem">${i<=s?"✅":"⚪"}</span><div class="n"><b>${t}</b>${i==s&&s<4?`<br><span class="muted">In progress</span>`:""}</div></div>`).join("")}<p class="muted">Demo speed: the status moves one step every minute so you can see how tracking works.</p></div><div class="box">${o.items.map(i=>{const p=find(i.id)||{bg:"#E6EEFD",e:"📦",n:"Item"};return `<div class="line"><div class="t" style="background:${p.bg}">${p.e}</div><div class="n">${p.n}${i.sz?` · Size ${i.sz}`:""} × ${i.q}</div></div>`}).join("")}</div>`,"t");
}
function viewPin(){
  open(head("Seller login")+`<div class="box"><p class="muted">${pin?"Enter your seller PIN.":"Create a seller PIN (4 to 8 digits). Keep it private."}</p><input class="f" id="pn2" type="password" inputmode="numeric" maxlength="8" aria-label="Seller PIN"><div class="err" id="err" role="alert"></div></div><button class="big" data-pinok>${pin?"Open seller panel":"Save PIN and continue"}</button>`,"s");
}
function checkPin(){
  const v=$("#pn2").value.trim();
  if(!/^\d{4,8}$/.test(v)){$("#err").textContent="Use 4 to 8 digits.";return}
  if(!pin){pin=v;sv("velor4-pin",pin)}else if(v!==pin){$("#err").textContent="Wrong PIN.";return}
  viewAdmin();
}
function viewAdmin(){
  photo="";
  open(head("Seller panel")+`<div class="box"><b>Add a product</b>
  <label class="l" for="ab">Brand</label><input class="f" id="ab"><label class="l" for="an">Product name</label><input class="f" id="an">
  <div class="two"><div style="flex:1"><label class="l" for="ap">Selling price ₹</label><input class="f" id="ap" inputmode="numeric"></div><div style="flex:1"><label class="l" for="am">MRP ₹</label><input class="f" id="am" inputmode="numeric"></div></div>
  <label class="l" for="ac">Category</label><select id="ac">${CATS.slice(1).map(c=>`<option>${c[0]}</option>`).join("")}</select>
  <label class="l" for="as">Sizes</label><select id="as"><option value="">No sizes</option><option value="A">Clothing: S to XL</option><option value="S">Shoes: 6 to 10</option></select>
  <label class="l" for="pf">Product photo</label><input type="file" id="pf" accept="image/*" class="f">
  <div class="err" id="err" role="alert"></div><button class="big" data-addp>Add product</button></div>
  <div class="box"><b>All products</b>${[...P0,...custom].map(p=>`<div class="line"><div class="t" style="background:${p.bg}">${p.e}</div><div class="n">${p.b} · ${p.n}<br><b>${inr(p.p)}</b>${hidden.includes(p.id)?' <span class="muted">(removed)</span>':""}</div>${hidden.includes(p.id)?"":`<button class="sz" data-delp="${p.id}">Remove</button>`}</div>`).join("")}${hidden.length?`<br><button class="sz" data-rst>Restore removed products</button>`:""}</div>
  <p class="muted">Changes here go live for all customers.</p>`,"ad");
}
function delProduct(id){
  if(id>=1000)custom=custom.filter(p=>p.id!=id);else hidden.push(id);
  sv("velor4-custom",custom);sv("velor4-hidden",hidden);buildP();render();viewAdmin();
}
function addProduct(){
  const b=$("#ab").value.trim(),n=$("#an").value.trim(),p=+$("#ap").value,m=+$("#am").value,c=$("#ac").value,s=$("#as").value;
  if(!b||!n||!(p>0)||!(m>p)){$("#err").textContent="Fill brand, name and price. MRP must be higher than the selling price.";return}
  custom.push({id:1000+Date.now()%1e9,c,b:safe(b),n:safe(n),p,m,e:photo?`<img src="${photo}" alt="">`:"📦",bg:"#E6EEFD",r:0,rv:"0",s:s=="A"?AP:s=="S"?SH:undefined});
  if(!sv("velor4-custom",custom)){custom.pop();$("#err").textContent="Storage is full. Try a smaller photo.";return}
  buildP();render();toast("Product added");viewAdmin();
}
document.addEventListener("change",e=>{
  const f=e.target.id=="pf"&&e.target.files[0];if(!f)return;
  const fr=new FileReader();
  fr.onload=()=>{const img=new Image();img.onload=()=>{const k=Math.min(1,500/Math.max(img.width,img.height)),c=document.createElement("canvas");c.width=img.width*k;c.height=img.height*k;c.getContext("2d").drawImage(img,0,0,c.width,c.height);photo=c.toDataURL("image/jpeg",.8);toast("Photo ready")};img.src=fr.result};
  fr.readAsDataURL(f);
});
$("#q").addEventListener("input",e=>{term=e.target.value.toLowerCase().trim();render()});
$("#sort").addEventListener("change",e=>{sort=e.target.value;render()});
render();
setTimeout(()=>{if(loadState=="loading"){loadState="error";render()}},12000);
</script>
